name: FitFlow CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # Frontend: Flutter CI
  # ==========================================
  frontend-ci:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/fitflow_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter codebase
        run: flutter analyze --no-fatal-infos

  # ==========================================
  # Backend: NestJS CI
  # ==========================================
  backend-ci:
    name: NestJS Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/core-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/core-api/package.json

      - name: Install backend dependencies
        run: npm install

      - name: Build NestJS application
        run: npm run build

  # ==========================================
  # AI Service: FastAPI CI
  # ==========================================
  ai-service-ci:
    name: FastAPI Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service/app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/app/requirements.txt

      - name: Install AI Service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check Python codebase
        run: python -m py_compile main.py
